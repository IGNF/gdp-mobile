server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routes React Router (/map, /reports…) : pas de fichier sur disque, renvoyer l'app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OAuth /token et /revoke same-origin (équivalent du proxy Vite /__sso, évite CORS Keycloak).
    location /__sso/ {
        proxy_pass https://sso.geopf.fr/realms/geoplateforme/protocol/openid-connect/;
        proxy_set_header Host sso.geopf.fr;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
