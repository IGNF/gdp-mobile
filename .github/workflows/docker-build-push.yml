name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:
  push:
    tags:
      - 'deploy-docker-dev'
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # Format : <org>/<repo>

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Nécessaire pour pousser sur GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=deploy-docker-dev,enable=${{ github.ref == 'refs/tags/deploy-docker-dev' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}  # Ne pas pousser sur les PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_OAUTH_WEB_REDIRECT_URI=https://geodiffusion.mut-dev.ign.fr/auth/callback
            VITE_SECRET=${{ secrets.VITE_SECRET }}
            VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}
            VITE_OAUTH_CLIENT_ID=${{ secrets.VITE_OAUTH_CLIENT_ID }}
            VITE_OAUTH_BASE_URL=${{ secrets.VITE_OAUTH_BASE_URL }}
            VITE_GEOPORTAIL_SCAN_API_KEY=${{ secrets.VITE_GEOPORTAIL_SCAN_API_KEY }}
            VITE_GDP_REPORT_COMMUNITY_ID=${{ secrets.VITE_GDP_REPORT_COMMUNITY_ID }}
            VITE_GDP_REPORT_DISPLAY_THEMES=${{ secrets.VITE_GDP_REPORT_DISPLAY_THEMES }}
            VITE_GDP_REPORT_SUBMISSION_THEME=${{ secrets.VITE_GDP_REPORT_SUBMISSION_THEME }}
            VITE_GDP_NEWS_URL=${{ secrets.VITE_GDP_NEWS_URL }}
            VITE_MATOMO_URL=${{ secrets.VITE_MATOMO_URL }}
            VITE_MATOMO_SITE_ID=${{ secrets.VITE_MATOMO_SITE_ID }}
            VITE_AUTH_REQUIRED=${{ secrets.VITE_AUTH_REQUIRED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 