name: iOS Deploy

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Build and Deploy iOS App
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Verify Xcode / iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Known hosts (GitHub)
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Make envfile
        run: |
          set -euo pipefail
          touch .env
          [ -n "${{ secrets.VITE_SECRET }}" ] && echo "VITE_SECRET=${{ secrets.VITE_SECRET }}" >> .env || true
          [ -n "${{ secrets.VITE_BASE_API_URL }}" ] && echo "VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env || true
          [ -n "${{ secrets.VITE_OAUTH_CLIENT_ID }}" ] && echo "VITE_OAUTH_CLIENT_ID=${{ secrets.VITE_OAUTH_CLIENT_ID }}" >> .env || true
          [ -n "${{ secrets.VITE_OAUTH_BASE_URL }}" ] && echo "VITE_OAUTH_BASE_URL=${{ secrets.VITE_OAUTH_BASE_URL }}" >> .env || true
          [ -n "${{ secrets.VITE_OAUTH_IOS_REDIRECT_URI }}" ] && echo "VITE_OAUTH_IOS_REDIRECT_URI=${{ secrets.VITE_OAUTH_IOS_REDIRECT_URI }}" >> .env || true
          [ -n "${{ secrets.VITE_GEOPORTAIL_SCAN_API_KEY }}" ] && echo "VITE_GEOPORTAIL_SCAN_API_KEY=${{ secrets.VITE_GEOPORTAIL_SCAN_API_KEY }}" >> .env || true
          [ -n "${{ secrets.VITE_GDP_REPORT_COMMUNITY_ID }}" ] && echo "VITE_GDP_REPORT_COMMUNITY_ID=${{ secrets.VITE_GDP_REPORT_COMMUNITY_ID }}" >> .env || true
          [ -n "${{ secrets.VITE_GDP_REPORT_DISPLAY_THEMES }}" ] && echo "VITE_GDP_REPORT_DISPLAY_THEMES=${{ secrets.VITE_GDP_REPORT_DISPLAY_THEMES }}" >> .env || true
          [ -n "${{ secrets.VITE_GDP_REPORT_SUBMISSION_THEME }}" ] && echo "VITE_GDP_REPORT_SUBMISSION_THEME=${{ secrets.VITE_GDP_REPORT_SUBMISSION_THEME }}" >> .env || true
          [ -n "${{ secrets.VITE_GDP_NEWS_URL }}" ] && echo "VITE_GDP_NEWS_URL=${{ secrets.VITE_GDP_NEWS_URL }}" >> .env || true
          [ -n "${{ secrets.VITE_MATOMO_URL }}" ] && echo "VITE_MATOMO_URL=${{ secrets.VITE_MATOMO_URL }}" >> .env || true
          [ -n "${{ secrets.VITE_MATOMO_SITE_ID }}" ] && echo "VITE_MATOMO_SITE_ID=${{ secrets.VITE_MATOMO_SITE_ID }}" >> .env || true
          [ -n "${{ secrets.VITE_AUTH_REQUIRED }}" ] && echo "VITE_AUTH_REQUIRED=${{ secrets.VITE_AUTH_REQUIRED }}" >> .env || true

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build:mobile

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Install Apple distribution cert and App Store profile
        env:
          DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          P12_PASSWORD_DISTR: ${{ secrets.P12_PASSWORD_DISTR }}
          DEPLOY_PROVISION_PROFILE_BASE64: ${{ secrets.DEPLOY_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_P12=$RUNNER_TEMP/dist.p12
          PROFILE=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$CERT_P12"
          echo -n "$DEPLOY_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -P "$P12_PASSWORD_DISTR" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          PROFILE_UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Build archive
        env:
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            clean archive

      - name: Export IPA
        env:
          EXPORT_PLIST_B64: ${{ secrets.IOS_EXPORT_PRODUCTION }}
        run: |
          set -euo pipefail
          EXPORT_PLIST=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_PLIST_B64" | base64 --decode > "$EXPORT_PLIST"
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 3

      - name: Save App Store Connect API key
        if: ${{ vars.IOS_DEPLOY_TO_TESTFLIGHT == 'true' }}
        env:
          API_KEY_B64: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_id="${{ secrets.APPSTORE_API_KEY_ID }}"
          if [[ -z "$key_id" ]]; then
            echo "APPSTORE_API_KEY_ID secret is missing" >&2
            exit 1
          fi
          mkdir -p ~/private_keys
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_B64" | base64 --decode > ~/private_keys/AuthKey_${key_id}.p8
          cp ~/private_keys/AuthKey_${key_id}.p8 ~/.appstoreconnect/private_keys/AuthKey_${key_id}.p8

      - name: Upload to TestFlight
        if: ${{ vars.IOS_DEPLOY_TO_TESTFLIGHT == 'true' }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          if [[ -z "$IPA" || ! -f "$IPA" ]]; then
            echo "No IPA found to upload" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
